openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Enquiry submissions from the marketing site
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit a new enquiry
      description: Stores a new enquiry submitted from the website contact form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnquiryRequest"
      responses:
        "201":
          description: Enquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CreateEnquiryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          maxLength: 200
        institute:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          maxLength: 100
        plan:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 2000
      required:
        - name
        - phone
        - institute
    Enquiry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        institute:
          type: string
        city:
          type: string
        plan:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - phone
        - email
        - institute
        - city
        - plan
        - message
        - createdAt
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
